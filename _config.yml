# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: The DETERMINISTIC6G Blog
subtitle: 
name: "DETERMINISTIC6G"
email: janos.harmatos@ericsson.com
description: >- # this means to ignore newlines until "baseurl:"
  Blog of the DETERMINISTIC6G Project
#baseurl: "" # the subpath of your site, e.g. /blog
domain: duerrfk.github.io
#url: https://duerrfk.github.io 
#url: http://vssdn2-2.infra.informatik.uni-stuttgart.de:6060
url: https://ipvs.informatik.uni-stuttgart.de
baseurl: /vs/det6gblog
#twitter_username: jekyllrb
#github_username:  jekyll

# Build settings
markdown: kramdown
#theme: minimal-mistakes-jekyll
remote_theme: mmistakes/minimal-mistakes@4.26.2
plugins:
  - jekyll-feed
  - jekyll-include-cache

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

# All pages go into this directory
include: ["_pages"]

locale: "en-US"

logo: "/assets/images/logo-det6g.png"

author:
  name : "DETERMINISTIC6G"
  bio : Deterministic end-to-end communication with 6G
  #location : "Swabia, Germany"
  links :
    - label: Homepage
      icon: "fab fa fa-home"
      url: "https://deterministic6g.eu"
    - label: Blog
      icon: "fab fa fa-blog"
      url: "https://deterministic6g.eu"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter-square"
      url: "https://twitter.com/DETERMINISTIC6G"
    - label: "Github"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/DETERMINISTIC6G"
    - label: "LinkedIn"
      icon: "fab fa-brands fa-linkedin"
      url: "https://www.linkedin.com/company/deterministic6g/"
    - label: "YouTube"
      icon: "fab fa-brands fa-youtube"
      url: "https://www.youtube.com/@DETERMINISTIC6G/videos"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true
      permalink: /posts/:year/:month/:day/:title:output_ext
      header:
        image: /assets/images/group_picture.jpg
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      header:
        image: /assets/images/group_picture.jpg
